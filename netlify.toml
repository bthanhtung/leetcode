# Static site for the algorithm visualizer (site/). Netlify regenerates site/data from the problem folders.
[build]
  command = "python3 site/build.py"
  publish = "site"

[build.environment]
  PYTHON_VERSION = "3.11"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
