plugins {
    id("java")
}

group = "com.tungdadev"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
}

// Problems live at the top level, one folder each: easy/TwoSum/{TwoSum.java, TwoSumTest.java, README.md}
sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "easy", "medium", "hard"]
            exclude "**/*Test.java"
        }
    }
    test {
        java {
            srcDirs = ["src/test/java", "easy", "medium", "hard"]
            include "**/*Test.java"
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.test {
    useJUnitPlatform()
    systemProperty "junit.jupiter.execution.timeout.default", "30 s"     // an infinite loop fails one test instead of hanging the build
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}